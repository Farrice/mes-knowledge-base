<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body>
  <div class="slide" data-surface="light">
    <!-- BACKGROUND — pure CSS canvas fill, no AI generation (rationale.md: form a-framed-image, edit_mode none) -->
    <div class="bg" style="position:absolute; inset:0; background: var(--brand-bg-light);"></div>

    <!-- MASTHEAD — editorial-style header: series title left, date + arrow right (../REVIEW-NOTES.md
         "aesthetic pivot: the editorial style"; diverges from the generic tokens.chrome.masthead wordmark
         row by Farrice's own explicit approval of this ref frame, see rationale.md §4) -->
    <div class="masthead" data-slot="MASTHEAD"
         style="left:7.8%; top:5.3%; width:84.4%; height:3%;">
      <span class="masthead-slot left" data-slot="SERIES_TITLE"
            style="font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                   font-size:2.41cqw; font-weight:700; letter-spacing:-0.01em;
                   color: var(--brand-text-on-light);">{{SERIES_TITLE}}</span>
      <span class="masthead-slot right" data-slot="POST_DATE"
            style="display:flex; align-items:baseline; gap:0.9em;
                   font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                   font-size:2.04cqw; font-weight:400;
                   color: var(--brand-text-on-light);">{{POST_DATE}}<span style="font-size:1.36em; line-height:1;">&rarr;</span></span>
    </div>

    <!-- HAIRLINE RULE 1 — brand decision-line move (moves.md #3), structural, not a slot -->
    <div class="rule"
         style="position:absolute; left:7.8%; top:11.1%; width:84.4%; height:0;
                border-top:1px solid var(--brand-line, var(--brand-secondary)); opacity:0.5;"></div>

    <!-- EVIDENCE CROP — a REAL per-post source capture (moves.md #8 "Evidence crop": "AI-generated imagery
         is not evidence and never fills this zone"). Contained rectangle on brand paper, hairline-bounded,
         object-fit:contain (never crops the source), no radius, no shadow (tokens.json prohibits both). -->
    <div class="zone photo-zone" data-slot="PHOTO_MAIN" data-zone="photo"
         style="position:absolute; left:7.8%; top:11.19%; width:84.4%; height:41.48%;
                background: var(--brand-text-on-dark, #FAFAF8); overflow:hidden;">
      <img src="{{PHOTO_MAIN_PATH}}" alt=""
           style="width:100%; height:100%; object-fit:contain; display:block;">
    </div>

    <!-- HAIRLINE RULE 2 — closes the evidence ledger box -->
    <div class="rule"
         style="position:absolute; left:7.8%; top:52.67%; width:84.4%; height:0;
                border-top:1px solid var(--brand-line, var(--brand-secondary)); opacity:0.5;"></div>

    <!-- SOURCE LABEL — moves.md #8's required annotation: caption token, graphite, names what the crop
         can carry (source URL, page, capture date) -->
    <div class="zone label" data-slot="EVIDENCE_LABEL"
         style="position:absolute; left:7.8%; top:53.9%; width:84.4%; height:3%;
                font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                font-size:1.85cqw; font-weight:700; text-transform:uppercase; letter-spacing:0.16em;
                color: var(--brand-secondary);">{{EVIDENCE_LABEL}}</div>

    <!-- VERDICT HEADLINE — the dominant idea: large lowercase display word, brand's only display face,
         full ink. Not occluded by anything (isolable per rationale.md §2) — stays prominent HTML. -->
    <div class="zone headline" data-slot="VERDICT_WORD"
         style="position:absolute; left:7.8%; top:60.74%; width:44.4%; height:16%; overflow:hidden;
                font-size:10.37cqw; font-weight:700; line-height:0.92; letter-spacing:-0.05em;
                color: var(--brand-text-on-light); text-align:left;">{{{VERDICT_WORD}}}</div>

    <!-- ANALYSIS BODY — the argument paragraph -->
    <div class="zone body" data-slot="ANALYSIS_BODY"
         style="position:absolute; left:7.8%; top:71.11%; width:70.4%; height:15%; overflow:hidden;
                font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                font-size:2.41cqw; font-weight:400; line-height:1.34; letter-spacing:0;
                color: var(--brand-text-on-light); text-align:left;">{{{ANALYSIS_BODY}}}</div>

    <!-- FOOTER — 4-slot identity/CTA strip (tokens.json modes.master_brand.offer_reference: "restrained
         footer… final frame only") -->
    <div class="masthead" data-slot="FOOTER"
         style="left:7.8%; top:93%; width:84.4%; height:3%;">
      <span data-slot="FOOTER_NAME"
            style="font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                   font-size:1.85cqw; font-weight:400; color: var(--brand-text-on-light);">{{FOOTER_NAME}}</span>
      <span data-slot="FOOTER_HANDLE"
            style="font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                   font-size:1.85cqw; font-weight:400; color: var(--brand-text-on-light);">{{FOOTER_HANDLE}}</span>
      <span data-slot="FOOTER_NICHE"
            style="font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                   font-size:1.85cqw; font-weight:400; color: var(--brand-text-on-light);">{{FOOTER_NICHE}}</span>
      <span data-slot="FOOTER_CTA"
            style="font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                   font-size:1.85cqw; font-weight:400; color: var(--brand-text-on-light);">{{FOOTER_CTA}}</span>
    </div>
  </div>
</body>
</html>
