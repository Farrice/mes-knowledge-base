<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../_shared/styles.css">
</head>
<body>
  <div class="slide" data-surface="light">
    <!-- BACKGROUND — pure CSS solid fill, no AI generation (rationale.md: form a-framed-image, bg is flat
         canvas, only the photo zone is a real asset — never generated, see Move #8 "Evidence crop") -->
    <div class="bg" style="position:absolute; inset:0; background: var(--brand-bg-light);"></div>

    <!-- MASTHEAD — editorial-style grammar (styles.json "editorial" ≠ the pool's "typographic" masthead):
         series title left, date + arrow right. 2-slot flex (never float). -->
    <div class="masthead" data-slot="MASTHEAD"
         style="left:7.78%; top:5.33%; width:84.44%; height:3%;">
      <span class="masthead-slot left" data-slot="SERIES_TITLE"
            style="font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                   font-size:2.41cqw; font-weight:700; letter-spacing:-0.01em;
                   color: var(--brand-text-on-light);">{{SERIES_TITLE}}</span>
      <span class="masthead-slot right"
            style="display:flex; align-items:baseline; gap:1.5cqw;
                   font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                   font-size:2.04cqw; font-weight:400; color: var(--brand-text-on-light);">
        <span data-slot="DATE">{{DATE}}</span>
        <span class="arrow" aria-hidden="true" style="font-size:2.78cqw; line-height:1;">&rarr;</span>
      </span>
    </div>

    <!-- PHOTO ZONE — Move #8 "Evidence crop": a REAL supplied source (product page / ad / label capture).
         Never AI-generated (rationale.md §3). Contained rectangle, object-fit:contain, no radius, no shadow. -->
    <div class="zone photo-zone" data-zone="photo"
         style="position:absolute; left:50%; top:11.11%; width:42.22%; height:45.93%; overflow:hidden;
                background: var(--brand-text-on-dark, #FAFAF8);">
      <img data-slot="PHOTO_MAIN" src="{{PHOTO_MAIN_PATH}}" alt=""
           style="width:100%; height:100%; object-fit:contain; display:block;">
    </div>

    <!-- HEADLINE — giant lowercase 2-line display stack (the approved editorial-pivot grammar,
         REVIEW-NOTES.md 2026-09-03). Sits in the left column beside the photo, never overlapping it. -->
    <div class="zone headline" data-slot="HEADLINE"
         style="position:absolute; left:7.78%; top:40%; width:40.74%; max-height:17%; overflow:hidden;
                font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                font-size:10.93cqw; font-weight:700; line-height:0.92; letter-spacing:-0.05em;
                color: var(--brand-text-on-light); text-align:left;">{{{HEADLINE}}}</div>

    <!-- BODY — full-width paragraph below both the headline column and the photo (photo ends at ~57%,
         this starts at 59.85%). Fixed-height box with overflow:hidden — the renderer's autosize net
         shrinks the font if a longer per-post paragraph would overflow (html-craft.md §3.5 (a)). -->
    <div class="zone body" data-slot="BODY"
         style="position:absolute; left:7.78%; top:59.85%; width:84.44%; height:11.5%; overflow:hidden;
                font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                font-size:2.41cqw; font-weight:400; line-height:1.34;
                color: var(--brand-text-on-light); text-align:left;">{{{BODY}}}</div>

    <!-- HAIRLINE RULE — brand decision-line move (moves.md #3), structural, not a slot -->
    <div class="rule"
         style="position:absolute; left:7.78%; top:72.59%; width:84.44%; height:0;
                border-top:1px solid var(--brand-text-on-light); opacity:0.15;"></div>

    <!-- THREE-ITEM BREAKDOWN ROW — Move #5-adjacent grammar (aligned fields, hairline-separated, no
         boxes/badges); content is a per-post 3-part analytical breakdown, not the fixed proof-boundary
         vocabulary (rationale.md §4). Three equal columns, uniform gutter. -->
    <div class="zone item-col" style="position:absolute; left:7.78%; top:74.81%; width:25.19%;
                display:flex; flex-direction:column; gap:0.9cqw;">
      <h4 data-slot="ITEM_1_TITLE"
          style="margin:0; font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                 font-weight:700; font-size:2.41cqw; letter-spacing:-0.02em;
                 color: var(--brand-text-on-light);">{{ITEM_1_TITLE}}</h4>
      <p data-slot="ITEM_1_TEXT"
         style="margin:0; font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                font-weight:400; font-size:1.94cqw; line-height:1.3;
                color: var(--brand-text-on-light);">{{{ITEM_1_TEXT}}}</p>
    </div>

    <div class="zone item-col" style="position:absolute; left:37.41%; top:74.81%; width:25.19%;
                display:flex; flex-direction:column; gap:0.9cqw;">
      <h4 data-slot="ITEM_2_TITLE"
          style="margin:0; font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                 font-weight:700; font-size:2.41cqw; letter-spacing:-0.02em;
                 color: var(--brand-text-on-light);">{{ITEM_2_TITLE}}</h4>
      <p data-slot="ITEM_2_TEXT"
         style="margin:0; font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                font-weight:400; font-size:1.94cqw; line-height:1.3;
                color: var(--brand-text-on-light);">{{{ITEM_2_TEXT}}}</p>
    </div>

    <div class="zone item-col" style="position:absolute; left:67.04%; top:74.81%; width:25.19%;
                display:flex; flex-direction:column; gap:0.9cqw;">
      <h4 data-slot="ITEM_3_TITLE"
          style="margin:0; font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                 font-weight:700; font-size:2.41cqw; letter-spacing:-0.02em;
                 color: var(--brand-text-on-light);">{{ITEM_3_TITLE}}</h4>
      <p data-slot="ITEM_3_TEXT"
         style="margin:0; font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                font-weight:400; font-size:1.94cqw; line-height:1.3;
                color: var(--brand-text-on-light);">{{{ITEM_3_TEXT}}}</p>
    </div>

    <!-- FOOTER STRIP — editorial-mode chrome: author identity, newsletter link, audience descriptor, CTA.
         4-item flex justify-content:space-between (never float). -->
    <div class="masthead footer" data-slot="FOOTER"
         style="position:absolute; left:7.78%; bottom:4.74%; width:84.44%;
                font-family: var(--font-display, 'Helvetica Neue', Helvetica, Arial, sans-serif);
                font-size:1.85cqw; font-weight:400; color: var(--brand-text-on-light);">
      <span data-slot="FOOTER_NAME">{{FOOTER_NAME}}</span>
      <span data-slot="FOOTER_LINK">{{FOOTER_LINK}}</span>
      <span data-slot="FOOTER_TOPIC">{{FOOTER_TOPIC}}</span>
      <span data-slot="FOOTER_CTA">{{FOOTER_CTA}}</span>
    </div>
  </div>
</body>
</html>
