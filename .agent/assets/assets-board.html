<style>
:root {

     Premium Minimal family (_active/farrice-brand/premium-minimal/REPORT-DIALECT.md):

  --ground:#0e0e0d; --panel:#181817; --ink:#fafaf8; --muted:#8c8c82;

}
* { box-sizing:border-box; }
html, body { background:var(--ground); color:var(--ink); margin:0;
  font:14px/1.45 -apple-system,"Segoe UI",sans-serif; }

nav { position:fixed; top:0; left:0; right:0; z-index:30; display:flex;

  transition:background .25s; }
nav.solid { background:rgba(14,14,13,.96); box-shadow:0 1px 0 rgba(255,255,255,.06); }
nav .brand { font-family:var(--display); font-weight:700; font-size:17px;

nav .brand b { color:var(--accent); }
nav a.navlink { color:var(--muted); text-decoration:none; font-size:13.5px;

nav a.navlink.active { color:var(--ink); font-weight:600; }
nav input[type=search] { margin-left:auto; background:rgba(20,20,20,.85);
  border:1px solid rgba(255,255,255,.14); color:var(--ink); border-radius:8px;
  padding:7px 14px; font-size:13px; width:250px; }
/* ── hero billboard ── */
.hero { position:relative; min-height:72vh; display:flex; align-items:flex-end;
  background-size:cover; background-position:center 30%; }
.hero::after { content:""; position:absolute; inset:0;

             linear-gradient(to right, rgba(14,14,13,.78) 0%, rgba(14,14,13,0) 55%); }
.hero .inner { position:relative; z-index:2; padding:0 4% 56px; max-width:640px; }
.hero.mini { min-height:42vh; }
.hero.mini .inner { padding-bottom:34px; }
.hero.mini h1 { font-size:clamp(22px, 3vw, 34px); }
.hero .kicker { font-family:var(--mono); font-size:11px; letter-spacing:.16em;
  text-transform:uppercase; color:var(--accent); margin-bottom:10px; }
.hero h1 { font-family:var(--display); font-size:clamp(26px, 4vw, 44px);
  font-weight:700; margin:0 0 10px; letter-spacing:-.01em;
  text-shadow:0 2px 18px rgba(0,0,0,.6); }
.hero .meta { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:18px; }
.hero .btns { display:flex; gap:10px; flex-wrap:wrap; }
.btn { display:inline-flex; align-items:center; gap:8px; font-size:14px;
  font-weight:600; padding:10px 22px; border-radius:6px; border:none;
  cursor:pointer; }
.btn.primary { background:var(--ink); color:#101010; }
.btn.primary:hover { background:#e7e7e3; }
.btn.ghost { background:rgba(128,128,128,.32); color:var(--ink); }
.btn.ghost:hover { background:rgba(128,128,128,.5); }
.pill { font-family:var(--mono); font-size:10.5px; padding:2px 9px; border-radius:999px;
  background:rgba(128,128,128,.25); color:var(--muted); }
.pill.cost { color:var(--warn); background:rgba(227,173,69,.16); }
/* ── shelves ── */
.shelves { position:relative; z-index:3; margin-top:-40px; padding:0 0 60px; }
.shelf { margin-bottom:34px; }
.shelf h2 { font-family:var(--display); font-size:17px; font-weight:600;
  margin:0 0 10px; padding:0 4%; }
.shelf h2 span { color:var(--muted); font-family:var(--mono); font-size:11px;
  font-weight:400; margin-left:10px; }
.row { display:flex; gap:8px; overflow-x:auto; padding:14px 4% 22px;
  scroll-snap-type:x proximity; scrollbar-width:none; }
.row::-webkit-scrollbar { display:none; }
.card { flex:0 0 auto; width:264px; aspect-ratio:16/9; scroll-snap-align:start;
  position:relative; border-radius:6px; overflow:hidden; cursor:pointer;
  background:var(--panel); transition:transform .22s ease, box-shadow .22s ease;
  transform-origin:center bottom; }
.card img, .card video { width:100%; height:100%; object-fit:cover; display:block; }
.card .glyph { display:flex; align-items:center; justify-content:center;
  height:100%; font-size:40px; }
.card .brief-glyph { flex-direction:column; gap:8px; padding:14px;
  /* Premium Minimal report dialect (_active/farrice-brand/premium-minimal/REPORT-DIALECT.md) */
  background:linear-gradient(135deg, #F3F3F0, #E9E9E5); border-top:2px solid #3D5A94; }
.card .brief-glyph .bg-icon { font-size:26px; }
.card .brief-glyph .bg-title { font-size:12px; line-height:1.35; text-align:center;
  color:#101010; font-weight:600; letter-spacing:.01em; max-height:3.9em; overflow:hidden; }
.card .tbadge { position:absolute; top:8px; left:8px; font-size:12px;
  background:rgba(14,14,13,.7); border-radius:6px; padding:2px 7px; z-index:2; }
.card .ov { position:absolute; inset:auto 0 0 0; padding:26px 12px 10px;

  opacity:0; transition:opacity .18s; z-index:2; }
.card:hover { transform:scale(1.16); z-index:5;
  box-shadow:0 18px 50px rgba(0,0,0,.65); }
.card:hover .ov { opacity:1; }
.card .ov .nm { font-size:12px; font-weight:600; overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; margin-bottom:6px; }
.card .ov .acts { display:flex; gap:6px; }
.iconbtn { font-size:12px; padding:4px 9px; border-radius:6px; border:none;
  background:rgba(128,128,128,.35); color:var(--ink); cursor:pointer; }
.iconbtn:hover { background:var(--accent); }

.filters { display:flex; gap:10px; flex-wrap:wrap; align-items:center;
  margin-bottom:6px; }
.filters select { background:var(--panel); border:1px solid rgba(255,255,255,.12);

.afilters { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 16px; }

.fchip button { border:none; background:none; color:var(--accent); cursor:pointer; }
.mgrid { columns:250px; column-gap:10px; }
.tile { position:relative; break-inside:avoid; margin:0 0 10px; border-radius:6px;
  overflow:hidden; cursor:pointer; background:var(--panel);
  transition:transform .18s, box-shadow .18s; }
.tile:hover { transform:scale(1.03); box-shadow:0 10px 34px rgba(0,0,0,.55); z-index:4; }
.tile img { width:100%; display:block; }

.tile .tbadge { position:absolute; top:8px; left:8px; font-size:12px;

#count { color:var(--muted); font-family:var(--mono); font-size:12px; }

.stylegrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr));

.stylecard { background:var(--panel); border-radius:8px; overflow:hidden;

.hint { color:var(--muted); font-size:13px; margin:0 0 18px; max-width:640px; }

button.act { font-family:var(--mono); font-size:11.5px; padding:6px 13px;

button.act:hover { background:var(--accent); color:#101010; }

#toast.show { opacity:1; }

  align-items:center; justify-content:center; z-index:60; }
#cpm.open { display:flex; }
#cpm .box { background:var(--panel); border-radius:10px; padding:20px;

#cpm textarea { width:100%; height:72px; background:var(--ground); color:var(--ink);
  border:1px solid rgba(255,255,255,.15); border-radius:6px;
  font-family:var(--mono); font-size:12px; }

rallax", "style": null, "prompt": null, "cost_usd": null, "ts": "2026-04-15T21:00:50Z", "w": 1376, "h": 768, "dur_s": null, "tags": [], "size": 347117, "thumb": "b9e41349f73233cb.jpg", "engine": null}, {"path": "deliverables/designs/parallax/mockup-cover.png", "type": "image", "zone": "deliverables-designs", "project": "parallax", "style": null, "prompt": null, "cost_usd": null, "ts": "2026-04-15T21:00:45Z", "w": 1024, "h": 1024, "dur_s": null, "tags": [], "size": 96756, "thumb": "83048e7cc579b437.jpg", "engine": null}, {"path": "deliverables/designs/parallax/banner-v3.png", "type": "image", "zone": "deliverables-designs", "project": "parallax", "style": "Twilight Contemplation", "prompt": "Wide photograph, through a heavily scratched and rain-spotted industrial window pane. On the left through the glass: a distant city skyline, warm amber streetlights (#FFBF00) glowing, muted neon signs. On the right through the glass: distant, soft-peaked mountains under a deep blue twilight sky (#1E3C72). The window glass exhibits prominent, real scratches, visible fingerprints, and distinct rain spots catching scattered light. The interior foreground is dark, revealing exposed brick edges on the left and right. A gender-neutral silhouette is leaning subtly against the interior window frame, facing outwards. Shot on a Nikon FM2, 28mm f/2.8 lens, ISO 400, using Fuji Superia 400 film. Heavy film grain, desaturated color palette, warm color cast overall. Twilight ambient lighting, warm city glow juxtaposed with cool mountain light. Gritty realism, authentic, raw, analog aesthetic.", "cost_usd": 0.0054, "ts": "2026-04-15T19:25:36Z", "w": 1376, "h": 768, "dur_s": null, "tags": [], "size": 778021, "thumb": "f229ef3df577c046.jpg", "engine": null}, {"path": "deliverables/designs/parallax/social-v3.png", "type": "image", "zone": "deliverables-designs", "project": "parallax", "style": "Writer's Patina", "prompt": "Heavily scratched and patinated dark walnut desk surface, seen from a direct overhead flat lay perspective. On the desk: an open, worn Moleskine notebook with genuine, imperfect blue ink handwriting (#0000FF), several words visibly crossed out. A faceted glass prism rests on the notebook's open pages, casting subtle violet (#8B00FF) and teal (#008080) light refractions across the handwriting. Beside it, a chipped (small chip at 3 o'clock position), matte black ceramic mug (#222222) filled with dark black coffee. A silver mechanical pencil (0.5mm lead) lies nearby. A small stack of three well-worn, hardcover books with faded spines (titles unreadable, generic worn texture) are partially visible at the top edge of the frame. Strong, directional morning sunlight entering from an unseen window to the upper right, casting long, sharp geometric shadows (45-degree angle) across the desk and objects. Visible, ethereal dust motes dance within the sunbeams, creating volumetric light. Shot on Fuji GW690 medium format rangefinder, 90mm f/3.5 lens, aperture f/5.6, ISO 400. Slightly warm color temperature, desaturated color palette, Fuji Pro 400H film emulation with softly lifted blacks, fine film grain, muted sepia and earthy tones. Mood: Authentic, introspective, quiet, reflective, un-staged reality, tangible history, found object aesthetic. Aspect Ratio 16:9.", "cost_usd": 0.0062, "ts": "2026-04-15T19:25:10Z", "w": 1376, "h": 768, "dur_s": null, "tags": [], "size": 845243, "thumb": "efef785afb2cb158.jpg", "engine": null}, {"path": "deliverables/designs/parallax/email-v3.png", "type": "image", "zone": "deliverables-designs", "project": "parallax", "style": "Twilight Ocean Liminality", "prompt": "A wide, expansive photograph of the open ocean at the precise moment between deep twilight and complete darkness. The horizon line bisects the frame precisely at the vertical center. The sky transitions horizontally from a celestial navy (#0A0A33) directly overhead, through a broad band of dusky violet (#5C3C6B), culminating in a slender, horizontal band of warm amber light (#FFBF00) precisely at the horizon. The ocean surface is almost perfectly still, exhibiting subtle, gentle ripples that delicately break any mirror-like reflection, preserving the textural integrity of the water. Shot on a Mamiya RZ67 medium format camera with a 90mm f/3.5 lens, set at f/11, utilizing a long exposure (approx. 5 seconds) to capture subtle motion blur in the water while retaining its liquid quality. Processed to emulate Kodak Portra 160 film, with pronounced photographic film grain, especially dense in the dark areas of the water. A subtle greenish color cast is present in the deepest shadow areas, indicative of expired film. Natural vignetting and lens falloff darken the extreme corners of the frame. The overall color temperature is cool to neutral, anchored by the warm amber horizon. The mood is one of quiet contemplation, serene aliveness, and imperfect authenticity, in the photographic style of Rinko Kawauchi. Aspect ratio 16:9.", "cost_usd": 0.006, "ts": "2026-04-15T19:25:10Z", "w": 1376, "h": 768, "dur_s": null, "tags": [], "size": 687793, "thumb": "d1d373eae5ac2a0c.jpg", "engine": null}, {"path": "deliverables/designs/parallax/cover-v3.png", "type": "image", "zone": "deliverables-designs", "project": "parallax", "style": "Brutalist Light Canvas", "prompt": "A lone, slightly blurred human figure, dressed in minimalist dark clothing, stands far right of the frame, providing scale. In the background, a vast, stark brutalist concrete gallery interior is centered around a large, perfectly rectangular opening in a raw concrete wall. This opening reveals three distinct, layered planes of light: the nearest plane is muted violet (#8A74A0), the middle plane is desaturated teal (#698B8B), and the deepest plane is warm amber (#D28A00). The raw concrete walls exhibit precise formwork marks, subtle hairline cracks, and authentic mineral deposits. The poured concrete floor is textured with visible, imperfect patches and a slightly uneven finish. Soft, ambient light of dusk fills the gallery. The layered light planes within the rectangular opening are the primary light source, casting long, soft, colored shadows (violet, teal, amber hues) that blend subtly across the concrete floor. Visible dust particles are illuminated within the light beams. A natural, subtle lens flare originates from the bright center of the light opening. Shot on a Hasselblad 500CM, with an 80mm f/2.8 Carl Zeiss Planar lens, aperture f/8. Long exposure (shutter speed 1/8s), ISO 100. Predominantly cool tones from the concrete and dusk light, contrasted by warm amber highlights from the deepest light plane. Overall, a slightly desaturated color palette with filmic shifts. Serene, contemplative, minimalist, ethereal, architectural, quiet wonder. A vintage architectural photograph, meticulously composed, documenting a conceptual light installation in the style of James Turrell, shot on Kodak Ektar 100 film. Emphasize visible film grain, slight color shifting in deep shadows, subtle chromatic aberration, and the tangible quality of a darkroom-printed analog photograph. The aesthetic should evoke the work of Julius Shulman, focusing on light, shadow, and concrete textures, devoid of digital perfection.", "cost_usd": 0.0062, "ts": "2026-04-15T19:24:50Z", "w": 1024, "h": 1024, "dur_s": null, "tags": [], "size": 676676, "thumb": "6037dd557131cc13.jpg", "engine": null}, {"path": "deliverables/designs/parallax/logo-v3.png", "type": "image", "zone": "deliverables-designs", "project": "parallax", "style": "Analog Spectrum Refraction", "prompt": "Extreme close-up macro photograph of a single polished, clear glass optical prism, positioned at a slight angle to reveal internal facets, resting on a sheet of raw, coarse black linen fabric, revealing pronounced woven texture and sporadic, microscopic dust particles illuminated by the light. Soft, diffused ambient window light entering from the top-left at 45 degrees, refracting through the prism into two distinct, soft spectral bands: one muted violet (#8E7CC3) and one desaturated teal (#6CA0A2). These spectral bands gently fall across the black linen, exhibiting imperfect, slightly feathered edges. The light subtly illuminates the dust on the fabric. Shot on expired Kodak Portra 400 film, Contax RTS III, Zeiss 100mm f/2.0 Makro-Planar lens, shallow depth of field. Visible, pronounced film grain throughout the entire frame. Subtle chromatic aberration present along the prism's edges. Natural lens vignetting darkens the bottom-left corner of the frame. Neutral to cool color temperature, emphasizing the desaturated tones. Analog, tactile, contemplative, deeply imperfect, quiet, reminiscent of a found contact sheet print from a film photographer's archive. Photorealistic analog photography, Wabi-Sabi aesthetic, still life photography, reminiscent of Wolfgang Tillmans or early 20th-century scientific photography with an artistic sensibility. Aspect ratio 1:1.", "cost_usd": 0.0058, "ts": "2026-04-15T19:24:44Z", "w": 1024, "h": 1024, "dur_s": null, "tags": [], "size": 765048, "thumb": "0fda4e98ec43a328.jpg", "engine": null}, {"path": "deliverables/designs/parallax/social-preview-v2.png", "type": "image", "zone": "deliverables-designs", "project": "parallax", "style": "Parallax Contemplation", "prompt": "Overhead editorial flat lay photograph: An open notebook, bone white pages (#F8F8F8) with subtle, illegible handwritten text, lies on a smooth, matte black desk surface (#000000). The notebook cover features the word 'PARALLAX' embossed in a clean, understated sans-serif typeface. Adjacent to the notebook, a clear glass prism refracts distinct violet (#8A2BE2) and teal (#008080) light across the paper. A matte black ceramic cup filled with black coffee is positioned deliberately to the side. Sharp, directional morning sunlight streams from a window at a 45-degree angle, casting crisp, geometric shadows across the entire scene. Shot on Fujifilm GFX 100S, 63mm f/4 lens, I arble, creating flawless mirror reflections of both landscapes above. The far end of the corridor recedes into a bright, diffuse warm light. The left window reveals a sprawling, hyper-detailed cyberpunk metropolis skyline at deep night, teeming with vibrant, saturated neon signs, holographic advertisements, and electric city lights (predominantly electric blues, glowing purples, fiery reds). The right window reveals a majestic, rugged mountain range under a low, soft golden hour sun, casting dramatic long shadows and bathed in rich earth tones (deep oranges, warm yellows, muted browns, hints of sage green). The figure is strongly silhouetted by a warm, diffuse golden backlight emanating from the far end of the corridor. The left window projects cool, electric artificial light into the corridor's left side, while the right window filters in soft, warm golden light onto the corridor's right side. The polished black marble floor perfectly reflects both the distinct lighting conditions and the contrasting landscapes, creating a seamless blend of cool and warm light on its surface. Ultra-wide cinematic shot, captured on ARRI Alexa 65, anamorphic 40mm lens, low angle, extreme depth of field, cinematic 2.39:1 aspect ratio letterboxed within a 16:9 frame. Cool teal (#008080) dominating shadows and city reflection, warm amber (#FFBF00) for highlights and mountain reflection, deep obsidian blacks (#000000) for the floor and figure's silhouette. Surreal, contemplative, solitary, expansive, philosophical, duality, neo-noir tension, profound quiet. Cinematography inspired by Roger Deakins' work in Blade Runner 2049, architectural scale of Syd Mead, minimalist aesthetic, conceptual art.", "cost_usd": 0.0062, "ts": "2026-04-15T19:15:56Z", "w": 1376, "h": 768, "dur_s": null, "tags": [], "size": 871197, "thumb": "33833a7ed4840baa.jpg", "engine": null}, {"path": "deliverables/designs/parallax/logo-v2-prism.png", "type": "image", "zone": "deliverables-designs", "project": "parallax",   b2.onclick = () => copyText(REPO + '/' + pick.path); btns.appendChild(b2);
  if (pick.prompt) { const b3 = el('button', 'btn ghost', '📝 Copy prompt');
    b3.onclick = () => copyText(pick.prompt); btns.appendChild(b3); }
}
// ── cards / shelves ──
function card(r) {
  const c = el('div', 'card');
  let media;
  const isBrief = r.zone === 'research-briefs';
  if (r.thumb) { media = el('img'); media.loading = 'lazy';
    media.src = 'thumbs/' + encodeURIComponent(r.thumb); c.appendChild(media); }
  else if (isBrief) {
    const g = el('div', 'glyph brief-glyph');
    g.appendChild(el('span', 'bg-icon', '📋'));
    g.appendChild(el('span', 'bg-title', (r.project || r.path.split('/').pop()).replace(/-/g, ' ')));
    c.appendChild(g);
  }
  else c.appendChild(el('div', 'glyph', TYPE_ICON[r.type] || '📄'));
  if (r.type !== 'image') c.appendChild(el('span', 'tbadge', TYPE_ICON[r.type] || ''));
  const ov = el('div', 'ov');
  ov.appendChild(el('div', 'nm', r.path.split('/').pop()));
  const acts = el('div', 'acts');
  const a1 = el('button', 'iconbtn', '📋');
  a1.title = 'Copy path';
  a1.onclick = e => { e.stopPropagation(); copyText(REPO + '/' + r.path); };
  acts.appendChild(a1);
  if (r.prompt) { const a2 = el('button', 'iconbtn', '📝');
    a2.title = 'Copy prompt';
    a2.onclick = e => { e.stopPropagation(); copyText(r.prompt); };
    acts.appendChild(a2); }
  ov.appendChild(acts);
  c.appendChild(ov);
  if (r.type === 'video') {
    let vid = null;
    c.addEventListener('mouseenter', () => {
      if (vid) return;
      vid = document.createElement('video');
      vid.muted = true; vid.loop = true; vid.autoplay = true; vid.src = relPath(r);
      if (media) c.replaceChild(vid, media); else c.prepend(vid);
    });
    c.addEventListener('mouseleave', () => {
      if (vid && media) { c.replaceChild(media, vid); vid = null; }
    });
  }
  c.onclick = () => { if (isBrief) window.open(relPath(r), '_blank'); else openLB(r); };
  return c;
}
function shelf(title, note, items) {
  if (!items.length) return null;
  const s = el('div', 'shelf');
  const h = el('h2', null, title);
  if (note) h.appendChild(el('span', null, note));
  s.appendChild(h);
  const row = el('div', 'row');
  items.forEach(r => row.appendChild(card(r)));
  s.appendChild(row);
  return s;
}
function facetValues(key) {
  const m = new Map();
  ALL.forEach(r => { const v = r[key]; if (v) m.set(v, (m.get(v)||0)+1); });
  return [...m.entries()].sort((a,b) => b[1]-a[1]);
}
function buildShelves() {
  const host = document.getElementById('shelves'); host.textContent = '';
  const byTs = [...ALL].sort((a,b) => (b.ts||'').localeCompare(a.ts||''));
  const add = s => { if (s) host.appendChild(s); };
  add(shelf('🕒 Recently added', byTs.length + ' total', byTs.slice(1, 21)));
  add(shelf('🎬 Video', null, byTs.filter(r => r.type === 'video').slice(0, 20)));
  add(shelf('🎵 Audio', null, byTs.filter(r => r.type === 'audio').slice(0, 20)));
  add(shelf('📋 Research Briefs', null, byTs.filter(r => r.zone === 'research-briefs').slice(0, 20)));
  facetValues('project').slice(0, 8).forEach(([p, n]) =>
    add(shelf('📁 ' + p, n + ' assets', byTs.filter(r => r.project === p).slice(0, 20))));
  facetValues('style').slice(0, 5).forEach(([st, n]) =>
    add(shelf('🎭 ' + st, n + ' assets', byTs.filter(r => r.style === st).slice(0, 20))));
}
// ── gallery view ──
function renderFilters() {
  const host = document.getElementById('filters'); host.textContent = '';
  FACETS.forEach(f => {
    const vals = facetValues(f.key); if (!vals.length) return;
    const s = document.createElement('select');
    const o0 = document.createElement('option');
    o0.value = ''; o0.textContent = f.label + ': all';
    s.appendChild(o0);
    vals.forEach(([v, n]) => { const o = document.createElement('option');
      o.value = v; o.textContent = v + ' (' + n + ')';
      if (sel[f.key] === v) o.selected = true;
      s.appendChild(o); });
    s.onchange = () => { sel[f.key] = s.value || null; refresh(); };
    host.appendChild(s);
  });
  const af = document.getElementById('afilters'); af.textContent = '';
  FACETS.forEach(f => {
    if (!sel[f.key]) return;
    const c = el('span', 'fchip', sel[f.key] + ' ');
    const x = el('button', null, '✕');
    x.onclick = () => { sel[f.key] = null; refresh(); };
    c.appendChild(x); af.appendChild(c);
  });
}
function tile(r) {
  const d = el('div', 'tile');
  if (r.thumb) { const img = el('img'); img.loading = 'lazy';
    img.src = 'thumbs/' + encodeURIComponent(r.thumb); d.appendChild(img); }
  else d.appendChild(el('div', 'glyph', TYPE_ICON[r.type] || '📄'));
  if (r.type !== 'image') d.appendChild(el('span', 'tbadge', TYPE_ICON[r.type] || ''));
  const ov = el('div', 'ov');
  ov.appendChild(el('div', 'nm', r.path.split('/').pop()));
  d.appendChild(ov);
  d.onclick = () => openLB(r);
  return d;
}
function applyFilters() {
  const q = document.getElementById('q').value.toLowerCase().trim();
  filtered = ALL.filter(r => {
    for (const f of FACETS) if (sel[f.key] && r[f.key] !== sel[f.key]) return false;
    if (q) {
      const hay = [(r.prompt||''), r.path, (r.style||''), (r.project||''),
                   (r.engine||''), (r.tags||[]).join(' ')].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  filtered.sort((a,b) => (b.ts||'').localeCompare(a.ts||''));
}
function renderMore() {
  const grid = document.getElementById('grid');
  const next = filtered.slice(shown, shown + CHUNK);
  next.forEach(r => grid.appendChild(tile(r)));
  shown += next.length;
  document.getElementById('more').style.display = shown < filtered.length ? 'block' : 'none';
  document.getElementById('count').textContent = shown + ' / ' + filtered.length;
}
function refresh() {
  applyFilters(); renderFilters();
  document.getElementById('grid').textContent = ''; shown = 0; renderMore();
  // gallery hero mirrors the active filter set
  const hg = document.getElementById('hero-gen');
  const lead = filtered.find(r => r.thumb);
  if (hg && lead) hg.style.backgroundImage =
    'url("thumbs/' + encodeURIComponent(lead.thumb) + '")';
  const active = FACETS.map(f => sel[f.key]).filter(Boolean);
  document.getElementById('gen-title').textContent =
    (active.length ? active.join(' · ') : 'All Assets').replace(/-/g, ' ').toUpperCase();
  const gm = document.getElementById('gen-meta'); gm.textContent = '';
  gm.appendChild(el('span', 'pill', filtered.length + ' assets'));
  const vids = filtered.filter(r => r.type === 'video').length;
  if (vids) gm.appendChild(el('span', 'pill', '🎬 ' + vids));
  const cost = filtered.reduce((s, r) => s + (+r.cost_usd || 0), 0);
  if (cost) gm.appendChild(el('span', 'pill cost', '$' + cost.toFixed(2) + ' invested'));
}
// ── nav / views ──
function setView(v) {
  ['home', 'gen', 'styles'].forEach(k => {
    const n = document.getElementById('view-' + k);
    if (n) n.style.display = v === k ? '' : 'none';
  });
  document.querySelectorAll('.navlink').forEach(a =>
    a.classList.toggle('active', a.dataset.v === v));
  document.getElementById('topnav').classList.toggle('solid', window.scrollY > 40);
  window.scrollTo(0, 0);
}
document.querySelectorAll('.navlink[data-v]').forEach(a =>
  a.addEventListener('click', () => setView(a.dataset.v)));
document.getElementById('q').addEventListener('input', () => {
  clearTimeout(window.__qt);
  window.__qt = setTimeout(() => { setView('gen'); refresh(); }, 200); });
document.getElementById('lbx').addEventListener('click', closeLB);
document.getElementById('cpx').addEventListener('click',
  () => document.getElementById('cpm').classList.remove('open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') {
  closeLB(); document.getElementById('cpm').classList.remove('open'); } });
document.getElementById('more').addEventListener('click', renderMore);
new IntersectionObserver(es => { if (es[0].isIntersecting && shown < filtered.length) renderMore(); })
  .observe(document.getElementById('sentinel'));
window.addEventListener('scroll', () => {
  document.getElementById('topnav').classList.toggle('solid', window.scrollY > 40);
});
// ── style cards ──
if (STYLES.length) {
  document.getElementById('styleslink').style.display = '';
  const hs = document.getElementById('hero-styles');
  const sthumb = (STYLES.find(s => s.thumb) || {}).thumb ||
    (([...ALL].sort((a,b) => (b.ts||'').localeCompare(a.ts||'')).find(r => r.thumb)) || {}).thumb;
  if (hs && sthumb) hs.style.backgroundImage =
    'url("thumbs/' + encodeURIComponent(sthumb) + '")';
  const sm = document.getElementById('styles-meta');
  sm.appendChild(el('span', 'pill', STYLES.length + ' styles banked'));
}
const sg = document.getElementById('stylegrid');
if (sg) STYLES.forEach(s => {
  const c = el('div', 'stylecard');
  if (s.thumb) { const img = el('img'); img.loading = 'lazy';
    img.src = 'thumbs/' + encodeURIComponent(s.thumb); c.appendChild(img); }
  const m = el('div', 'meta');
  m.appendChild(el('div', 'name', s.name));
  m.appendChild(el('div', 'desc', s.desc));
  const b1 = el('button', 'act', '📝 Copy prompt'); b1.onclick = () => copyText(s.prompt);
  m.appendChild(b1);
  if (s.ref) { const b2 = el('button', 'act', '📋 Copy reference path');
    b2.onclick = () => copyText(REPO + '/' + s.ref); m.appendChild(b2); }
  c.appendChild(m);
  sg.appendChild(c);
});
buildHero(); buildShelves(); refresh();
</script></body></html>
