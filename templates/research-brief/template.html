<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE_PLAIN}} · Research Brief</title>
<style>
  /* ── Codex Antigravity Design System tokens (_active/codex-harvest-2026-06-11/DESIGN.md) ── */
  :root{
    --ag-ink: oklch(18% 0.012 245);
    --ag-paper: oklch(97% 0.008 92);
    --ag-surface: oklch(93% 0.012 100);
    --ag-line: oklch(76% 0.018 95);
    --ag-accent: oklch(55% 0.115 43);
    --ag-proof: oklch(49% 0.082 168);
    --ag-risk: oklch(56% 0.126 23);
    --ag-focus: oklch(50% 0.105 265);
    --ag-ink-soft: oklch(38% 0.012 245);
    --ag-ink-mute: oklch(52% 0.012 245);
    --ag-paper-ink: oklch(94% 0.01 92);   /* paper-toned text on ink surfaces */
    --ag-line-ink: oklch(34% 0.012 245);  /* rules on ink surfaces */
    --sans:'Helvetica Neue','Neue Haas Grotesk Text Pro',Helvetica,Inter,system-ui,Arial,sans-serif;
    --serif:'Source Serif 4',Georgia,'Times New Roman',serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{ background:var(--ag-paper); color:var(--ag-ink); font-family:var(--sans);
        -webkit-print-color-adjust:exact; print-color-adjust:exact }
  .wrap{ max-width:760px; margin:0 auto; padding:0 28px 90px }

  /* ── chrome ── */
  .brief-nav{ position:sticky; top:0; z-index:9; background:var(--ag-paper);
    border-bottom:1px solid var(--ag-line); padding:12px 0; margin-bottom:52px }
  .brief-nav .row{ max-width:760px; margin:0 auto; padding:0 28px; display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  .brief-nav a{ font-family:var(--mono); font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--ag-ink-soft); text-decoration:none; border:1px solid var(--ag-line); border-radius:99px; padding:4px 11px }
  .brief-nav a:hover{ border-color:var(--ag-accent); color:var(--ag-accent) }
  .chip{ display:inline-block; font-family:var(--mono); font-size:9.5px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ag-accent); border:1px solid var(--ag-accent); border-radius:99px; padding:4px 12px }
  .kicker{ font-family:var(--mono); font-size:10px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ag-ink-mute); font-weight:500; display:block }
  h1.display{ font-size:56px; line-height:1.02; letter-spacing:-.022em; font-weight:700; margin:20px 0 0; max-width:12ch }
  h1.display em, h2.sec em{ font-family:var(--serif); font-style:italic; font-weight:400; color:var(--ag-accent) }
  .dek{ font-size:16px; line-height:1.55; color:var(--ag-ink-soft); max-width:56ch; margin-top:18px }
  p{ font-size:14px; line-height:1.6; color:var(--ag-ink-soft) }
  strong{ color:var(--ag-ink); font-weight:600 }

  /* trust header */
  .trust{ display:grid; grid-template-columns:repeat(4,1fr); border-top:1px solid var(--ag-ink); border-bottom:1px solid var(--ag-line);
    margin-top:36px }
  .trust > div{ padding:12px 14px 12px 0 }
  .trust > div + div{ border-left:1px solid var(--ag-line); padding-left:14px }
  .trust .k{ font-family:var(--mono); font-size:8.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--ag-ink-mute); display:block; margin-bottom:5px }
  .trust .v{ font-size:12px; line-height:1.4; color:var(--ag-ink); font-weight:500 }

  /* sections */
  section.blk{ margin-top:72px; scroll-margin-top:70px }
  .sechead{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; border-bottom:1px solid var(--ag-line); padding-bottom:10px; margin-bottom:22px }
  .secnum{ font-family:var(--serif); font-style:italic; font-size:15px; color:var(--ag-accent) }
  h2.sec{ font-size:27px; letter-spacing:-.015em; font-weight:700; flex:1 }
  .sectag{ font-family:var(--mono); font-size:8.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--ag-ink-mute);
    border:1px solid var(--ag-line); border-radius:99px; padding:3px 9px; white-space:nowrap }

  .panel{ background:var(--ag-surface); border-radius:6px; padding:18px 20px; margin-top:8px }
  .panel p{ font-size:13.5px }

  /* evidence rows */
  .ev{ display:grid; grid-template-columns:auto 1fr; gap:12px 14px; padding:16px 0; border-bottom:1px solid var(--ag-line); align-items:start }
  .ev .mark{ width:20px; height:20px; border-radius:4px; background:var(--ag-proof); color:var(--ag-paper);
    display:flex; align-items:center; justify-content:center; font-size:11px; margin-top:2px }
  .ev h3{ font-size:15px; font-weight:600; letter-spacing:-.005em; line-height:1.35 }
  .ev p{ font-size:12.5px; line-height:1.55; margin-top:4px }
  .ev .meta{ display:flex; gap:10px; align-items:center; margin-top:8px; flex-wrap:wrap }
  .srcref{ font-family:var(--mono); font-size:9px; letter-spacing:.08em; color:var(--ag-focus); text-decoration:none }
  .srcref:hover{ text-decoration:underline }
  .conf{ font-family:var(--mono); font-size:8px; letter-spacing:.14em; border-radius:3px; padding:2px 7px; font-weight:700 }
  .conf.verified{ color:var(--ag-proof); border:1px solid var(--ag-proof) }
  .conf.likely{ color:var(--ag-accent); border:1px solid var(--ag-accent) }
  .conf.unconfirmed{ color:var(--ag-risk); border:1px solid var(--ag-risk) }

  /* decision layer — the one inverted section */
  .decision{ background:var(--ag-ink); color:var(--ag-paper-ink); border-radius:8px; padding:38px 36px 30px; margin-top:72px; scroll-margin-top:70px }
  .decision .kicker{ color:oklch(70% 0.02 92) }
  .decision h2{ font-size:34px; letter-spacing:-.02em; font-weight:700; margin-top:12px; color:var(--ag-paper-ink) }
  .decision h2 em{ font-family:var(--serif); font-style:italic; font-weight:400; color:oklch(75% 0.1 43) }
  .decision .dek{ color:oklch(78% 0.015 92); font-size:14px; margin-top:12px }
  .dec-item{ display:grid; grid-template-columns:auto 1fr; gap:12px 14px; padding:15px 0; border-bottom:1px solid var(--ag-line-ink); align-items:start }
  .dec-item:last-child{ border-bottom:none }
  .dec-item .n{ font-family:var(--serif); font-style:italic; font-size:15px; color:oklch(75% 0.1 43); min-width:22px; margin-top:1px }
  .dec-item h3{ font-size:16px; font-weight:600; color:var(--ag-paper-ink); line-height:1.35 }
  .dec-item p{ font-size:12.5px; line-height:1.55; color:oklch(75% 0.015 92); margin-top:4px }

  /* bars — same-scale small multiples */
  .bars-group{ display:grid; gap:14px; margin-top:6px }
  .bars-card{ background:var(--ag-surface); border-radius:6px; padding:16px 18px }
  .bars-card h3{ font-size:14px; font-weight:600 }
  .bars-card .note{ font-size:11.5px; color:var(--ag-ink-mute); margin-top:2px }
  .bars{ display:flex; align-items:flex-end; gap:4px; height:72px; margin-top:12px }
  .bars i{ flex:1; background:var(--ag-focus); border-radius:2px 2px 0 0; min-height:2px }
  .bars-caption{ font-family:var(--mono); font-size:9px; letter-spacing:.12em; text-transform:uppercase; color:var(--ag-ink-mute); margin-top:10px }
  /* comparison mode: horizontal bars, one card */
  .hbar-row{ display:grid; grid-template-columns:200px 1fr 34px; gap:12px; align-items:center; padding:7px 0 }
  .hbar-row + .hbar-row{ border-top:1px solid var(--ag-line) }
  .hbar-label{ font-size:12.5px; font-weight:600; color:var(--ag-ink); line-height:1.3 }
  .hbar-label .hnote{ display:block; font-size:10px; font-weight:400; color:var(--ag-ink-mute); margin-top:1px }
  .hbar-track{ height:14px; background:var(--ag-paper); border-radius:3px; overflow:hidden }
  .hbar-track i{ display:block; height:100%; background:var(--ag-focus); border-radius:3px 0 0 3px }
  .hbar-track i.zero{ background:var(--ag-risk); opacity:.55 }
  .hbar-val{ font-family:var(--mono); font-size:11px; color:var(--ag-ink-soft); text-align:right; font-weight:700 }
  @media (max-width:640px){ .hbar-row{ grid-template-columns:110px 1fr 28px } }

  /* deploy blocks */
  .deploy{ border:1px solid var(--ag-line); border-radius:6px; margin-top:14px; overflow:hidden }
  .deploy .bar{ display:flex; justify-content:space-between; align-items:center; background:var(--ag-surface); padding:8px 14px }
  .deploy .bar .k{ font-family:var(--mono); font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--ag-ink-soft); font-weight:700 }
  .copybtn{ font-family:var(--mono); font-size:9px; letter-spacing:.1em; text-transform:uppercase; cursor:pointer;
    background:none; border:1px solid var(--ag-line); border-radius:4px; padding:4px 10px; color:var(--ag-ink-soft) }
  .copybtn:hover{ border-color:var(--ag-accent); color:var(--ag-accent) }
  .copybtn.done{ border-color:var(--ag-proof); color:var(--ag-proof) }
  .deploy pre{ padding:14px 16px; font-family:var(--mono); font-size:11.5px; line-height:1.6; color:var(--ag-ink);
    white-space:pre-wrap; word-break:break-word }

  /* caveats */
  .caveats h2{ font-size:27px; font-weight:700; letter-spacing:-.015em }
  .caveats h2 em{ font-family:var(--serif); font-style:italic; font-weight:400; color:var(--ag-risk) }
  .caveats p{ margin-top:14px; max-width:60ch }
  .cta{ display:inline-block; margin-top:22px; font-family:var(--mono); font-size:10px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ag-paper); background:var(--ag-accent); border-radius:99px; padding:10px 20px; text-decoration:none; font-weight:700 }

  /* ledger */
  table.ledger{ width:100%; border-collapse:collapse; margin-top:6px }
  .ledger th{ text-align:left; font-family:var(--mono); font-size:8.5px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ag-ink-mute); padding:0 10px 8px 0; border-bottom:1px solid var(--ag-ink) }
  .ledger td{ font-size:11.5px; line-height:1.45; color:var(--ag-ink-soft); padding:9px 10px 9px 0; border-bottom:1px solid var(--ag-line); vertical-align:top }
  .ledger td a{ color:var(--ag-focus); text-decoration:none; word-break:break-all }
  .ledger td a:hover{ text-decoration:underline }

  footer.brief{ margin-top:80px; border-top:1px solid var(--ag-ink); padding-top:12px; display:flex; justify-content:space-between;
    font-family:var(--mono); font-size:9px; letter-spacing:.14em; text-transform:uppercase; color:var(--ag-ink-mute) }

  @media (max-width:640px){
    h1.display{ font-size:38px }
    .trust{ grid-template-columns:1fr 1fr }
    .trust > div{ border-left:none !important; padding-left:0 !important; border-bottom:1px solid var(--ag-line) }
    .decision{ padding:26px 20px }
  }
  @media print{
    .brief-nav{ position:static }
    .copybtn{ display:none }
    section.blk, .decision{ break-inside:avoid-page }
  }
</style>
</head>
<body>

<nav class="brief-nav"><div class="row">{{NAV}}</div></nav>

<div class="wrap">
  <header>
    <span class="chip">{{CHIP}}</span>
    <h1 class="display">{{TITLE}}</h1>
    <p class="dek">{{DEK}}</p>
    <div class="trust">
      <div><span class="k">Window</span><span class="v">{{WINDOW}}</span></div>
      <div><span class="k">Lens</span><span class="v">{{LENS}}</span></div>
      <div><span class="k">Sources</span><span class="v">{{SOURCES}}</span></div>
      <div><span class="k">Compiled</span><span class="v">{{COMPILED}}</span></div>
    </div>
  </header>

  {{SECTIONS}}

  <footer class="brief">
    <span>{{FOOTER_LEFT}}</span>
    <span>{{FOOTER_RIGHT}}</span>
  </footer>
</div>

<script>
(function(){
  function copyText(txt, btn){
    function ok(){ btn.classList.add('done'); btn.textContent='copied'; setTimeout(function(){ btn.classList.remove('done'); btn.textContent='copy'; }, 1600); }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(ok, function(){ fallback(txt); ok(); });
    } else { fallback(txt); ok(); }
  }
  function fallback(txt){
    var ta=document.createElement('textarea'); ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} document.body.removeChild(ta);
  }
  document.querySelectorAll('.copybtn').forEach(function(btn){
    btn.addEventListener('click', function(){
      var pre=btn.closest('.deploy').querySelector('pre');
      if(pre) copyText(pre.textContent, btn);
    });
  });
})();
</script>
</body>
</html>
