<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap">
  <style>
  body { margin:0; }
  .frame { width:1080px; height:1350px; position:relative; overflow:hidden;
           font-family:'Figtree','Avenir Next',sans-serif; box-sizing:border-box; }
  /* Russian slides only. Figtree has no cyrillic subset; Manrope does. */
  .ru { font-family:'Manrope','Figtree','Avenir Next',sans-serif; }
  .light { background:#FFFFFF; color:#4A1420; }
  .dark  { background:#3B0F1A;  color:#FFFFFF; }
  .si { font-family:'Playfair Display',Georgia,serif; font-style:italic; font-weight:500; }
  .light .si { color:#A85A52; }
  .dark .si  { color:#E8C4BE; }
  .caps { font-weight:600; letter-spacing:0.24em; text-transform:uppercase; }

  /* --- photography layer (framing is per slide, inline on the img — never global) --- */
  .photo { position:absolute; inset:0; z-index:0; overflow:hidden; }
  .photo > img { width:100%; height:100%; object-fit:cover; display:block;
                 transform-origin:center; }
  .tint  { position:absolute; inset:0; background:#3B0F1A; mix-blend-mode:multiply; }
  .lift  { position:absolute; inset:0; background:#E8D2CE; mix-blend-mode:screen; }
  .scrim { position:absolute; inset:0; }
  .duo > img { filter:grayscale(1) contrast(1.14) brightness(0.86); }
  .duo .tint { opacity:0.92; }
  .duo .lift { opacity:0.10; }
  .bleed > img { filter:sepia(0.30) hue-rotate(-10deg) saturate(0.88)
                          contrast(1.06) brightness(0.94); }
  .bleed .scrim { background:linear-gradient(180deg,
        rgba(26,8,13,0.62) 0%, rgba(26,8,13,0.48) 26%,
        rgba(26,8,13,0.64) 60%, rgba(26,8,13,0.86) 100%); }

  /* --- shared furniture --- */
  .pad  { position:relative; z-index:1; display:flex; flex-direction:column; height:100%;
          box-sizing:border-box; padding:64px 72px; justify-content:space-between; }
  .rule { display:flex; justify-content:space-between; align-items:baseline;
          padding-bottom:22px; }
  .foot { display:flex; justify-content:space-between; align-items:baseline; }
  .ghost { position:absolute; font-family:'Playfair Display',Georgia,serif; font-weight:500;
           font-size:760px; line-height:0.8; z-index:0; }
  .h    { font-weight:600; letter-spacing:-0.02em; }
</style>
</helmet>
<div class="frame dark">
<div class="pad"><div class="rule" style="border-bottom:1px solid rgba(255,255,255,0.34);"><div class="caps" style="font-size:21px;">THE AMERICAN TRANSACTION</div><div class="caps" style="font-size:21px; opacity:0.75;">REEL · 04 — PORTRAIT SLOT</div></div><div class="h" style="font-size:92px; line-height:1.14; max-width:930px;">I don't have anyone<br>to fall back on.<br>so my clients <span class="si">do.</span></div><div style="display:flex; justify-content:space-between; align-items:center;"><div class="caps" style="font-size:21px; color:rgba(255,255,255,0.74);">@GIGIMIRONOVA_REALESTATE</div><svg width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" stroke="#FFFFFF" stroke-width="2.5"/><path d="M26 21 L45 32 L26 43 Z" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" fill="none"/></svg></div></div>
</div>
</x-dc>
</body>
</html>
