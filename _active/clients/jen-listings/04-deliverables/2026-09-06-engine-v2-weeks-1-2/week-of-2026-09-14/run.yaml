    day: "thu sept 17 · 6:30pm"
    hook: fully approved... and the insurance quote still moves your payment.
    thumb: 05-position-insurance-before-the-offer-cover
    slides: 0
    photos:
      - vannuys-blvd-2024
      - california-bungalow-00
      - house-key-lock-00
      - jen-porch-vannuys
    photo_source: placeholder
    caption: |-
      the insurance quote now comes before the offer, not once we're in escrow with the clock already running.

      on october 15, 2026 the california FAIR plan rises 29.1% on average. it's the state's backup fire policy, what you get when no regular company will cover the house. the increase is weighted to wildfire risk... hillside and canyon homes can see far more.

      the day your policy starts decides the rate. start before the 15th and you generally keep today's rate for the whole term.

      valley floor? most homes still get a regular company.

      selling a hillside home this fall? the same quote is the first thing your buyer's lender will ask about. worth knowing before the sign goes up.

      source: california dept of insurance, oct 15, 2026.

      my DMs are open... send me the address. or just the street, if that's as far as you've gotten. i'll tell you which paper i'd read first.

      approved and insured are two different yeses.

      #SFV #sanfernandovalleyrealtor #losangelesrealestate #shermanoaks #woodlandhills
    reply: "an address → saved reply 1, then 2 the next day. 'is this true for my house' → saved reply 2 shape."
  - id: 06-position-tarzana-median-sellers
    district: position
    job: position (seller side)
    format: card
    format_note: card · 3 slides
    day: "sat sept 19 · 9:00am"
    hook: if you own in tarzana, that headline hit your phone too.
    thumb: 06-position-tarzana-median-sellers-1
    slides: 3
    photos:
      - sfv-aerial-nara
      - valley-street-01
      - jen-frontdoor
    photo_source: placeholder
    caption: |-
      if you own in tarzana, that headline hit your phone too: the median sale price was $949,676 in july, 14.5% below last july. it's still not your number.

      a median is the middle of every sale, from a $650,000 fixer to a $19,999,000 estate. a few big closings at the top one month and the whole number moves. your house didn't.

      the number that actually decides your list price: what homes like yours closed for this summer, three streets in every direction. same bed count, same era, same condition. that's a list of five or six addresses, not a percentage.

      send me the street. not the address, just the street. i'll pull what closed around you this summer and tell you what i'd list at. no pitch, no pressure... and if the honest answer is "wait," i'll say that too.

      i'm here for you. that's my job. i do this to protect you and your best interest.

      source: redfin, all home types, july 2026 vs july 2025.
      #tarzana #sanfernandovalley #valleyrealestate #homevalue #SFV
    reply: "a street or 'what's mine worth' → saved reply 2 (the seller one)."
