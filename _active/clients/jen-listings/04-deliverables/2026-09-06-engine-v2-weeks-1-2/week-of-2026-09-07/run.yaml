    format: carousel
    format_note: carousel · 6 slides · approved design, her photos + approved plates
    day: "sat sept 12 · 9:00am"
    hook: realtor code words. the Valley edition. what the listing actually means.
    thumb: 10-position-code-words-1
    slides: 6
    photos:
      - "01"
      - "02"
      - "03"
      - "04"
      - "05"
