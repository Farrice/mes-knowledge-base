  - id: 02-connect-just-breathe
    district: connect
    job: connect
    format: card
    format_note: card · 3 slides · her photos
    day: "thu sept 10 · 6:30pm"
    hook: just breathe.
    thumb: 02-connect-just-breathe-1
    slides: 3
    photos:
      - listing-03-pool (hers)
      - listing-02-living (hers)
      - jen-headshot-studio (hers)
    photo_source: hers
    caption: |-
      if the numbers are loud at night, i say the same thing to every client: just breathe. take a step back. let's sleep on it and talk in the morning. nothing you decide at 11pm with the calculator app open counts as a decision.

      in the morning i ask two things. what did your lender actually quote you, not the number on the news. and have we looked at a buydown... that's someone paying a little now so your rate is lower, for good or just for the first couple of years. there's usually a way to structure the loan for the you that exists right now, not a version of you who makes more later.

      i'm here for you. that's my job. i do this to protect you and your best interest.

      if it's late and the numbers are loud, send me the number, buying or selling. we'll look at it in the morning. or just say "same."

      #sanfernandovalley #SFV #valleyrealestate #mortgagerates
