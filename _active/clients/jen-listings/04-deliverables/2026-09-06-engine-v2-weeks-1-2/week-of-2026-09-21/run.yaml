    format_note: reel · 23 s
    day: "tue sept 22 · 7:30am"
    hook: "$900K in woodland hills. $900K in reseda. same week."
    thumb: 07-attract-900k-woodland-hills-vs-reseda-cover
    slides: 0
    photos:
      - suburban-neighborhood-aerial-02
      - california-bungalow-00
      - front-door-house-00
      - valley-street-01
      - jen-porch-vannuys
    photo_source: placeholder
    caption: |-
      $900K in woodland hills vs. $900K in reseda, same week, both on the market right now (neither one mine):

      woodland hills... $900,000. 3 bed, 2 bath, 1,160 sq ft.
      reseda... $899,000. 4 bed, 3 bath, 1,625 sq ft. that's 465 more square feet and a fourth bedroom, for a thousand dollars less.

      the difference is the zip. and the zip is a real thing... resale, the commute, the coffee. it's just not the only thing.

      three things i'd want to know before you pick:
      how long you're staying (under five years, the extra bedroom wins more often than people think).
      whether you'd ever rent a room or add on (more house now, or more house later).
      what homes like each one actually closed for last month, three streets over (i pull it before we write).

      buying or selling, send me your number and the zip you keep coming back to. i'll send you the two i'd go see first this weekend.

      i'm here for you. that's my job. i do this to protect you and your best interest.

      prices from the MLS, sept 2, 2026. they move.
      #woodlandhills #reseda #sanfernandovalley #valleyrealestate #SFV
    reply: "a zip or a number arrives → saved reply 3. an address → saved reply 1."
  - id: 08-position-two-markets-one-street
    district: position
    job: position (both sides)
    format: card
    format_note: card · 3 slides
    day: "thu sept 24 · 6:30pm"
    hook: two markets on the same tarzana street.
    thumb: 08-position-two-markets-one-street-1
    slides: 3
    photos:
      - sfv-aerial-nara
      - valley-street-01
      - jen-porch-vannuys
    photo_source: placeholder
    caption: |-
      there are two markets on the same tarzana street right now.

      the average home sells for about 2% under asking after about 55 days. the hot ones go pending in about 25 days at about 2% over asking. same neighborhood, same month... 88 homes sold in july, up from 77 last july, and the median came down 14.5%. more homes moving, at lower prices, and a few that still get a bidding war.

      buying: the house that's been sitting since july has room in the price, and the seller knows it. the one that just listed and looks right will not wait for you to sleep on it twice.

      selling: the first 25 days decide which market you're in. price, photos, and the first weekend. after that you're negotiating with the calendar.

      buying or selling, send me the street. i'll tell you which one you're standing in.

      i'm here for you. that's my job. i do this to protect you and your best interest.

      source: redfin tarzana market page, read sept 2, 2026 (july data).
      #tarzana #sanfernandovalley #valleyrealestate #SFV #homevalue
    reply: "a street from a buyer → saved reply 3 shape (number + zip). a street from an owner / 'what's mine worth' → saved reply 2."
  - id: 09-connect-just-breathe
    district: connect
    job: connect
    format: card
    format_note: card · 2 slides
    day: "sat sept 26 · 9:00am"
    hook: just breathe.
    thumb: 09-connect-just-breathe-1
    slides: 2
    photos:
      - palm-tree-sunset-city-02
      - jen-porch-vannuys
    photo_source: placeholder
    caption: |-
      if the numbers are loud at night, i say the same thing to every client: just breathe. take a step back. let's sleep on it and talk in the morning... anything happening right before bed is not the time to decide.

      in the morning i ask two things. what did your lender actually quote you. and have we looked at a buydown... someone pays a little now so your rate is lower, for good or just the first couple of years. there's usually a way to structure the loan so it works for the you that exists right now.

      if it's late and the numbers are loud, send me the number, buying or selling. we'll look at it in the morning. or just say hi.

      i'm here for you. that's my job. i do this to protect you and your best interest.

      #sanfernandovalley #SFV #valleyrealestate #mortgagerates
    reply: "a number or a quote → saved reply 3. a feeling ('same', 'ugh, the numbers') → in her words: 'i know. send me the number when you're up. we'll look together.'"
