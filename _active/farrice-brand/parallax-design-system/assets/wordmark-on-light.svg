<?xml version="1.0" encoding="UTF-8"?>
<!--
  Parallax Wordmark — light-background variant
  Same 3% offset but with ink letters on transparent/light backgrounds (the second L stays violet — the brand constant).
  Use: print, light Substack themes, business card, anywhere the surface is paper-toned or white.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344 256" width="1344" height="256" role="img" aria-label="PARALLAX">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
      .wordmark {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 140px;
        letter-spacing: 0.02em;
        dominant-baseline: middle;
      }
    ]]></style>
  </defs>
  <g class="wordmark" transform="translate(672, 128)" text-anchor="middle">
    <text>
      <tspan fill="#1C1C1E">PARAL</tspan><tspan fill="#7B61FF">L</tspan><tspan fill="#1C1C1E">AX</tspan>
    </text>
  </g>
</svg>
