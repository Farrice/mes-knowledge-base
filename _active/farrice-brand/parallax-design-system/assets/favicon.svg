<?xml version="1.0" encoding="UTF-8"?>
<!--
  Parallax Favicon — 32x32 native, also export 64x64 PNG.
  Square, sharp corners, solid #1C1C1E with violet "P" — same logic as avatar but never circular.
  Spec: parallax-design-system/DESIGN.md → components.favicon
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Parallax">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
      .favicon-letter {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 22px;
        dominant-baseline: central;
      }
    ]]></style>
  </defs>
  <rect x="0" y="0" width="32" height="32" fill="#1C1C1E"/>
  <text class="favicon-letter" x="16" y="17.5" text-anchor="middle" fill="#7B61FF">P</text>
</svg>
