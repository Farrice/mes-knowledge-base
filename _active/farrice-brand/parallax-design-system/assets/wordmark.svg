<?xml version="1.0" encoding="UTF-8"?>
<!--
  Parallax Wordmark — primary identity asset
  The 3% offset: second L (6th letter) in violet (#7B61FF), all other letters warm-white (#F5F0EB).
  Spec: parallax-design-system/DESIGN.md → components.wordmark
  Use: light-on-dark contexts (place on solid #1C1C1E or any dark background). For light backgrounds, use wordmark-on-light.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1344 256" width="1344" height="256" role="img" aria-label="PARALLAX">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
      .wordmark {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 140px;
        letter-spacing: 0.02em;
        dominant-baseline: middle;
      }
    ]]></style>
  </defs>
  <g class="wordmark" transform="translate(672, 128)" text-anchor="middle">
    <text>
      <tspan fill="#F5F0EB">PARAL</tspan><tspan fill="#7B61FF">L</tspan><tspan fill="#F5F0EB">AX</tspan>
    </text>
  </g>
</svg>
