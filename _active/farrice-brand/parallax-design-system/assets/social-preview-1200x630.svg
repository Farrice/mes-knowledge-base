<?xml version="1.0" encoding="UTF-8"?>
<!--
  Parallax Social Preview / OG Image (1200x630)
  Used as the Open Graph image for any Parallax link share on LinkedIn, Twitter, etc.
  Reads cleanly at thumbnail size — that's the test.
  Spec: parallax-design-system/DESIGN.md → components.social-card
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Parallax — for people who see everything from more than one angle">
  <defs>
    <style type="text/css"><![CDATA[
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=Source+Serif+4:ital,wght@1,400&display=swap');
      .wordmark {
        font-family: 'Space Grotesk', system-ui, sans-serif;
        font-weight: 700;
        font-size: 100px;
        letter-spacing: 0.02em;
      }
      .tagline {
        font-family: 'Source Serif 4', 'Source Serif Pro', Georgia, serif;
        font-weight: 400;
        font-style: italic;
        font-size: 22px;
        opacity: 0.6;
      }
    ]]></style>
  </defs>
  <rect x="0" y="0" width="1200" height="630" fill="#1C1C1E"/>

  <!-- Wordmark at 40% from top -->
  <g transform="translate(600, 252)" text-anchor="middle">
    <text class="wordmark" dominant-baseline="middle">
      <tspan fill="#F5F0EB">PARAL</tspan><tspan fill="#7B61FF">L</tspan><tspan fill="#F5F0EB">AX</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <text class="tagline" x="600" y="335" text-anchor="middle" fill="#F5F0EB">For people who see everything from more than one angle</text>

  <!-- Violet rule -->
  <line x1="500" y1="378" x2="700" y2="378" stroke="#7B61FF" stroke-width="1"/>
</svg>
