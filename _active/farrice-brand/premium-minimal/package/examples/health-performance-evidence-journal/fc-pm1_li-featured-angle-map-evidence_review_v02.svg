  <line x1="120" y1="132" x2="1800" y2="132" stroke="#D8D8D3" stroke-width="2"/>

  <text x="120" y="220" font-size="18" fill="#555553" class="label">FEATURED / 02 · BEFORE ANOTHER CREATIVE ROUND</text>
