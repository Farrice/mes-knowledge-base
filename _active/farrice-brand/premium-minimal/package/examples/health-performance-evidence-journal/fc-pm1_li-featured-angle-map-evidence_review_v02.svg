  <text x="120" y="592" font-size="30" fill="#555553" class="secondary">One 60-minute live read. Three named campaign angles. One lead recommendation.</text>

  <line x1="120" y1="700" x2="680" y2="700" stroke="#555553" stroke-width="2"/>
  <line x1="680" y1="700" x2="1240" y2="700" stroke="#555553" stroke-width="2"/>
  <line x1="1240" y1="700" x2="1800" y2="700" stroke="#101010" stroke-width="6"/>
  <line x1="680" y1="700" x2="680" y2="920" stroke="#D8D8D3" stroke-width="2"/>
  <line x1="1240" y1="700" x2="1240" y2="920" stroke="#D8D8D3" stroke-width="2"/>
  <line x1="120" y1="920" x2="1800" y2="920" stroke="#D8D8D3" stroke-width="2"/>

  <text x="120" y="752" font-size="16" fill="#8C8C82" class="label">01</text>
  <text x="120" y="804" font-size="18" fill="#555553" class="label">READ</text>
