<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1584" height="396" viewBox="0 0 1584 396" role="img" aria-labelledby="title description">
  <title id="title">The Angle Map premium minimalist LinkedIn banner</title>
  <desc id="description">A warm bone, minimalist banner for The Angle Map using one Helvetica Neue type family and a restrained hierarchy.</desc>

  <image
    x="0"
    y="0"
    width="1584"
    height="396"
    preserveAspectRatio="xMidYMid slice"
    href="angle-map-linkedin-banner-premium-minimal-v2-background.png"
    xlink:href="angle-map-linkedin-banner-premium-minimal-v2-background.png"
  />
  <rect width="1584" height="396" fill="#F3F0EA" opacity="0.34"/>

  <!-- Left field intentionally remains quiet for the profile-photo overlap. -->
  <g transform="translate(438 0)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#151514">
    <text x="0" y="73" font-size="15" font-weight="500" letter-spacing="4.2">THE ANGLE MAP</text>
    <line x1="0" y1="98" x2="1072" y2="98" stroke="#151514" stroke-opacity="0.22" stroke-width="1"/>

    <text x="0" y="191" font-size="50" font-weight="500" letter-spacing="-1.3">Three campaign angles.</text>
    <text x="0" y="252" font-size="50" font-weight="400" letter-spacing="-1.5">One clear decision on what to build first.</text>

    <text x="0" y="334" fill="#53514D" font-size="13" font-weight="500" letter-spacing="2.6">FOR SUPPLEMENT + PERFORMANCE BRANDS</text>
  </g>
</svg>
