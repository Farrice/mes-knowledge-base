<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#F3F3F0"/>
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .label { font-weight: 700; letter-spacing: .16em; }
    .display { letter-spacing: -.025em; }
  </style>
  <text x="84" y="92" font-size="22" font-weight="700" fill="#101010" text-anchor="start" class="label"><tspan x="84" dy="0">THE ANGLE MAP</tspan></text>
     <text x="996" y="170" font-size="20" font-weight="700" fill="#101010" text-anchor="end" class="label"><tspan x="996" dy="0">FICTIONAL DEMONSTRATION · NOT CLIENT WORK</tspan></text>
     <line x1="84" y1="128" x2="996" y2="128" stroke="#D8D8D3" stroke-width="2"/>
     <text x="84" y="280" font-size="92" font-weight="700" fill="#8C8C82" text-anchor="start" class="display"><tspan x="84" dy="0">02</tspan></text>
     <text x="250" y="245" font-size="70" font-weight="700" fill="#101010" text-anchor="start" class="display"><tspan x="250" dy="0">The Label</tspan><tspan x="250" dy="76">You Can Read</tspan></text>
     <line x1="84" y1="430" x2="996" y2="430" stroke="#101010" stroke-width="5"/>
     <text x="84" y="500" font-size="18" font-weight="700" fill="#555553" text-anchor="start" class="label"><tspan x="84" dy="0">CORE BUYER BELIEF</tspan></text>
     <text x="84" y="570" font-size="38" font-weight="500" fill="#101010" text-anchor="start"><tspan x="84" dy="0">If I can understand what I am buying,</tspan><tspan x="84" dy="50">I can make a more confident choice.</tspan></text>
     <line x1="84" y1="720" x2="996" y2="720" stroke="#D8D8D3" stroke-width="2"/>
     <text x="84" y="780" font-size="18" font-weight="700" fill="#555553" text-anchor="start" class="label"><tspan x="84" dy="0">HOOK DIRECTIONS</tspan></text>
     <text x="84" y="850" font-size="30" font-weight="400" fill="#555553" text-anchor="start"><tspan x="84" dy="0">01  Turn the pack around.</tspan><tspan x="84" dy="54">02  The formula should be as clear as the front.</tspan><tspan x="84" dy="54">03  Nothing heroic. Just legible.</tspan></text>
     <line x1="84" y1="1050" x2="520" y2="1050" stroke="#D8D8D3" stroke-width="2"/>
     <text x="84" y="1110" font-size="17" font-weight="700" fill="#555553" text-anchor="start" class="label"><tspan x="84" dy="0">APPROVED-PROOF DIRECTION</tspan></text>
     <text x="84" y="1170" font-size="24" font-weight="400" fill="#555553" text-anchor="start"><tspan x="84" dy="0">Client-approved formula panel,</tspan><tspan x="84" dy="34">serving information, and packaging facts.</tspan></text>
     <line x1="560" y1="1050" x2="996" y2="1050" stroke="#D8D8D3" stroke-width="2"/>
     <text x="560" y="1110" font-size="17" font-weight="700" fill="#555553" text-anchor="start" class="label"><tspan x="560" dy="0">EDITORIAL BOUNDARY</tspan></text>
     <text x="560" y="1170" font-size="24" font-weight="400" fill="#555553" text-anchor="start"><tspan x="560" dy="0">Editorial direction is not legal</tspan><tspan x="560" dy="34">or regulatory approval.</tspan></text>
</svg>