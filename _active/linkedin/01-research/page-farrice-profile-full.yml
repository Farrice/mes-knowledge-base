                                      - text: "You are automating your own irrelevance.Most coaches think putting LinkedIn on autopilot is a flex.They open ChatGPT. It spits out 500 words on \"leveraging core competencies.\" They click schedule and think they just saved 10 hours.What they actually did was pay a robot to make them sound like everyone else.Welcome to the era of \"AI Slop.\"You know the posts:❌ Packaged in unnatural corporate politeness.❌ Using words like \"delve,\" \"tapestry,\" and \"testament.\"❌ Completely devoid of lived experience.When your clients read your perfectly polished, soulless post, they don't think you're smart.They think you're lazy.Posting generic AI content is like putting a cheap plastic mannequin in the window of a luxury boutique.It doesn't matter how brilliant your coaching is inside. The display is turning premium clients away at the door.Don't let a robot ruin your reputation.I built a diagnostic tool to fix this: The \"Slop Detector.\"It's a brutal AI prompt that tears your last 3 posts apart, exposes your robotic tics, and rebuilds them using your actual, lived experience.It takes 2 minutes. It hurts to read. It will change your content forever.Drop the word \"SLOP\" below, and I'll send you the test. 👇"
